spring:
  datasource:
    url: jdbc:h2:mem:maindb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  data:
    redis:
      url: redis://localhost:6379
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ""
    port: 3025
    username: ""
    password: ""

budget:
  datasource:
    url: jdbc:h2:mem:budgetdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: sa

app:
  cors:
    allowed-origins: http://localhost:3000

server:
  port: 0

spring.jwt:
  secret: aVeryLongDummySecretKeyForTestingPurposesThatIsAtLeast256BitsLong2023!aVeryLongDummySecretKeyForTestingPurposesThatIsAtLeast256BitsLong2023!
  expiration: 86400000
